plugins {
    id "java-library"
}

group = "self-written"
def buildVersion = providers.gradleProperty("projectVersion").getOrElse("1.0.0")
version = buildVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs.add("-Xlint:all")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.named("processResources") {
    filesMatching("plugin.yml") {
        expand(version: buildVersion)
    }
}

tasks.withType(Jar).configureEach {
    archiveBaseName = project.name
    archiveVersion = ""
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

def paperApiVersion = "1.12.2-R0.1-20190714.184133-413"
configurations {
    frameworkEmbedded
}

dependencies {
    api("cn.mythicland:mythic-framework-bukkit:1.0.0") { transitive = false }
    api("cn.mythicland:mythic-framework-core:1.0.0") { transitive = false }
    api("cn.mythicland:mythic-framework-database:1.0.0") { transitive = false }
    frameworkEmbedded("cn.mythicland:mythic-framework-bukkit:1.0.0") { transitive = false }
    frameworkEmbedded("cn.mythicland:mythic-framework-core:1.0.0") { transitive = false }
    frameworkEmbedded("cn.mythicland:mythic-framework-database:1.0.0") { transitive = false }
    compileOnly("com.destroystokyo.paper:paper-api:${paperApiVersion}")
    compileOnly("org.jetbrains:annotations:24.0.1")

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.2")
    testImplementation("org.mockito:mockito-core:5.12.0")
    testImplementation("com.destroystokyo.paper:paper-api:${paperApiVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2")
}

tasks.named("jar") {
    dependsOn configurations.frameworkEmbedded
    from({ configurations.frameworkEmbedded.collect { zipTree(it) } }) {
        include "cn/mythicland/framework/**"
        include "materials/**"
    }
}
